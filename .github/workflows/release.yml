name: Publish to npm (with provenance)

# Publishes the package to npm whenever a GitHub Release is published,
# attaching a signed SLSA build provenance attestation (Sigstore-backed)
# so consumers can verify the package was built from this repo + workflow.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write   # required for npm provenance (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - run: npm install
      - run: npm run build
      - run: npm test
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
