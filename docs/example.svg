  <circle cx="42" cy="144" r="6" fill="#79c0ff"/><text x="60" y="150" fill="#79c0ff" font-size="19" font-family="ui-monospace,'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,monospace" font-weight="600">grep</text><text x="254" y="150" fill="#e6edf3" font-size="18" font-family="ui-monospace,'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,monospace">search input for lines matching a pattern</text><circle cx="42" cy="188" r="6" fill="#7ee787"/><text x="60" y="194" fill="#7ee787" font-size="19" font-family="ui-monospace,'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,monospace" font-weight="600">-r</text><text x="254" y="194" fill="#e6edf3" font-size="18" font-family="ui-monospace,'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,monospace">search directories recursively</text><circle cx="42" cy="232" r="6" fill="#ffa657"/><text x="60" y="238" fill="#ffa657" font-size="19" font-family="ui-monospace,'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,monospace" font-weight="600">-n</text><text x="254" y="238" fill="#e6edf3" font-size="18" font-family="ui-monospace,'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,monospace">prefix each match with its line number</text><circle cx="42" cy="276" r="6" fill="#d2a8ff"/><text x="60" y="282" fill="#d2a8ff" font-size="19" font-family="ui-monospace,'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,monospace" font-weight="600">TODO</text><text x="254" y="282" fill="#e6edf3" font-size="18" font-family="ui-monospace,'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,monospace">an argument passed to the command</text><circle cx="42" cy="320" r="6" fill="#ff7b72"/><text x="60" y="326" fill="#ff7b72" font-size="19" font-family="ui-monospace,'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,monospace" font-weight="600">src</text><text x="254" y="326" fill="#e6edf3" font-size="18" font-family="ui-monospace,'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,monospace">an argument passed to the command</text><circle cx="42" cy="364" r="6" fill="#f2cc60"/><text x="60" y="370" fill="#f2cc60" font-size="19" font-family="ui-monospace,'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,monospace" font-weight="600">|</text><text x="254" y="370" fill="#e6edf3" font-size="18" font-family="ui-monospace,'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,monospace">pipe — send this command's output into the next command</text><circle cx="42" cy="408" r="6" fill="#56d4dd"/><text x="60" y="414" fill="#56d4dd" font-size="19" font-family="ui-monospace,'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,monospace" font-weight="600">head</text><text x="254" y="414" fill="#e6edf3" font-size="18" font-family="ui-monospace,'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,monospace">print the first part of files</text><circle cx="42" cy="452" r="6" fill="#ff9bce"/><text x="60" y="458" fill="#ff9bce" font-size="19" font-family="ui-monospace,'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,monospace" font-weight="600">-20</text><text x="254" y="458" fill="#e6edf3" font-size="18" font-family="ui-monospace,'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,monospace">a numeric option (often a count or limit)</text>
